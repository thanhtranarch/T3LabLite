# Fails a push or pull request that loses a ribbon tool or the usage tracking,
# e.g. after copying folders over from t3lab_dev. See lite_guard/guard.py.
# Also runs the weekly auto-update tests (lite_guard/test_update_schedule.py)
# and the old-ribbon-folder cleanup tests (lite_guard/test_ribbon_retire.py)
# and the split-button memory tests (lite_guard/test_ribbon_memory.py)
# and the once-per-version What's new popup tests (lite_guard/test_whats_new.py)
# and the MCP server / bridge / security policy tests (lite_guard/test_mcp_server.py)
# and the LLM provider tests (lite_guard/test_llm_providers.py)
# and the Assistant's remote MCP server tests (lite_guard/test_assistant_mcp.py)
# and the Assistant window split tests (lite_guard/test_assistant_structure.py)
# and the shared project memory tests (lite_guard/test_memory_hub.py)
# and the instant small-talk tests (lite_guard/test_assistant_smalltalk.py)
# and the usage tracking privacy tests (lite_guard/test_tracking_privacy.py)
# and the FamiGen Studio tests (lite_guard/test_famigen_claude.py, test_famigen_studio.py).
name: Lite guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tools and tracking hooks
        run: python3 lite_guard/guard.py
      - name: Test the guard itself (CRLF and LF checkouts)
        run: python3 lite_guard/test_guard.py
      - name: Test the automatic update schedule
        run: python3 lite_guard/test_update_schedule.py
      - name: Test the old ribbon folder cleanup
        run: python3 lite_guard/test_ribbon_retire.py
      - name: Test the split button memory
        run: python3 lite_guard/test_ribbon_memory.py
      - name: Test the What's new popup
        run: python3 lite_guard/test_whats_new.py
      - name: Test the MCP server, bridge and security policy
        run: python3 lite_guard/test_mcp_server.py
      - name: Test FamiGen's direct Claude session and family types
        run: python3 lite_guard/test_famigen_claude.py
      - name: Test FamiGen Studio (protocol, page, MCP link, schema extras)
        run: python3 lite_guard/test_famigen_studio.py
      - name: Test the LLM providers (Gemini, Custom, OpenAI)
        run: python3 lite_guard/test_llm_providers.py
      - name: Test remote MCP servers in the Assistant
        run: python3 lite_guard/test_assistant_mcp.py
      - name: Test the Assistant window split (XAML handlers, moved methods)
        run: python3 lite_guard/test_assistant_structure.py
      - name: Test the project memory shared with Claude (memory hub)
        run: python3 lite_guard/test_memory_hub.py
      - name: Test instant small talk (greetings skip the worker turn)
        run: python3 lite_guard/test_assistant_smalltalk.py
      - name: Test usage tracking privacy (consent first, minimum data)
        run: python3 lite_guard/test_tracking_privacy.py
      - name: Test the BatchOut export report and profile files
        run: python3 lite_guard/test_batchout_report.py
      - name: Test the BatchOut DWG image reference cleanup
        run: python3 lite_guard/test_batchout_refs.py
      - name: Test the BatchOut PDF24 printer engine
        run: python3 lite_guard/test_batchout_pdf24.py
      - name: Test BatchOut Save V/S Set (PrintRange, view order)
        run: python3 lite_guard/test_batchout_sheet_sets.py
      - name: Test MCP Control's AutoCAD tab (t3lab-autocad client configs)
        run: python3 lite_guard/test_mcp_cad_clients.py
      - name: Test Connect installing the AutoCAD / Civil 3D add-in
        run: python3 -W ignore lite_guard/test_addin_installer.py
      - name: Test the pyRevit Routes port guard
        run: python3 -W ignore lite_guard/test_routes_guard.py
      - name: Test agent cursors (actions, followed views, bridge agent stamp)
        run: python3 lite_guard/test_agent_cursors.py
      - name: Test the Agent Cursors bar and Settings dialog on a fake WPF (bands, motion)
        run: python3 lite_guard/test_agent_cursors_overlay.py
      - name: Test consent on the Agent Cursors bar (Allow / Deny, offer)
        run: python3 lite_guard/test_cursor_consent.py
      - name: Test the opt-in tool open timing log
        run: python3 lite_guard/test_open_timing.py
      - name: Test pyrevit.revit is first imported on Revit's thread (no thread imports it)
        run: python3 -W ignore lite_guard/test_pyrevit_revit_thread.py
      - name: Test the pyRevit reload patch is for pyRevit before 7.0 only
        run: python3 lite_guard/test_pyrevit_patch_versions.py
      - name: Test the Assistant user name (own file, asked once, no built-in name)
        run: python3 lite_guard/test_lite_user.py
      - name: Test the data hub (snapshot, store, t3lab_hub)
        run: python3 lite_guard/test_data_hub.py
      - name: Test the MCP bridge refresh at Revit start
        run: python3 lite_guard/test_bridge_deploy.py
      - name: Test the MCP bridge over stdio (UTF-8, no proxy, junk lines)
        run: python3 lite_guard/test_bridge_stdio.py
      - name: Test MCP code for module imports shadowed inside functions
        run: python3 lite_guard/test_mcp_shadowing.py
      - name: Test MCP Control never destroys a config file it cannot read
        run: python3 lite_guard/test_mcp_config_safety.py
