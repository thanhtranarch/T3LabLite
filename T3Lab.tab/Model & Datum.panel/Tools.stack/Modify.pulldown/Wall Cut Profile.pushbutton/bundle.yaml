title: "Wall\nCut Profile"
tooltip: "Create openings where ducts, pipes, cable trays, beams or columns cross walls - from this model, plus any linked models you tick."
description: |
  Scans this model, and the linked models you tick when Include linked models is on
  Places a wall-hosted opening family or a rectangular wall opening at each crossing
  Target walls: every wall in the current view, or only the walls you pick
