title: "Batch\nLink"
tooltip: "Manage Revit links, link new models, set the workset each link sits on, control per-view link display"
description: |
  Manage Links: status, path, reference type and pins of every link; Reload, Reload From, Switch to Cloud, Unload, Pin, Overlay / Attachment, Remove
  Link Models: link many models at once, each on its own workset if you want, from a folder or from Autodesk Docs (cloud links, never the Desktop Connector copy)
  Link Workset: move the link instances of this model onto one of its worksets
  View Display: set By Host View / By Linked View / Custom, visibility and halftone
  Display settings need Revit 2025 or newer
author: "Tran Tien Thanh"
version: "1.3.0"
