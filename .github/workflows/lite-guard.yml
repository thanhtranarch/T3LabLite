# Fails a push or pull request that loses a ribbon tool or the usage tracking,
# or breaks a test. One step runs lite_guard/guard.py and every
# lite_guard/test_*.py (lite_guard/run_all.py), so a new test needs no edit
# here (2026-11-17: a duplicated `run:` key made this file invalid and no
# check ran for 37 pushes; lite_guard/test_workflow.py now guards the file).
name: Lite guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard and every lite_guard test
        run: python3 lite_guard/run_all.py
