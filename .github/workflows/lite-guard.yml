# Fails a push or pull request that loses a ribbon tool or the usage tracking,
# e.g. after copying folders over from t3lab_dev. See lite_guard/guard.py.
# Also runs the weekly auto-update tests (lite_guard/test_update_schedule.py)
# and the old-ribbon-folder cleanup tests (lite_guard/test_ribbon_retire.py)
# and the split-button memory tests (lite_guard/test_ribbon_memory.py)
# and the once-per-version What's new popup tests (lite_guard/test_whats_new.py)
# and the MCP server / bridge / security policy tests (lite_guard/test_mcp_server.py)
# and the LLM provider tests (lite_guard/test_llm_providers.py)
# and the Assistant's remote MCP server tests (lite_guard/test_assistant_mcp.py)
# and the Assistant window split tests (lite_guard/test_assistant_structure.py)
# and the shared project memory tests (lite_guard/test_memory_hub.py).
name: Lite guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tools and tracking hooks
        run: python3 lite_guard/guard.py
      - name: Test the automatic update schedule
        run: python3 lite_guard/test_update_schedule.py
      - name: Test the old ribbon folder cleanup
        run: python3 lite_guard/test_ribbon_retire.py
      - name: Test the split button memory
        run: python3 lite_guard/test_ribbon_memory.py
      - name: Test the What's new popup
        run: python3 lite_guard/test_whats_new.py
      - name: Test the MCP server, bridge and security policy
        run: python3 lite_guard/test_mcp_server.py
      - name: Test the LLM providers (Gemini, Custom, OpenAI)
        run: python3 lite_guard/test_llm_providers.py
      - name: Test remote MCP servers in the Assistant
        run: python3 lite_guard/test_assistant_mcp.py
      - name: Test the Assistant window split (XAML handlers, moved methods)
        run: python3 lite_guard/test_assistant_structure.py
      - name: Test the project memory shared with Claude (memory hub)
        run: python3 lite_guard/test_memory_hub.py
