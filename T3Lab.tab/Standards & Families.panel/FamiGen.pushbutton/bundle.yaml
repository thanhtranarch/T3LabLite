title: "FamiGen"
tooltip: "FamiGen Studio: chat with Claude to create Revit families and review them in 3D. Needs pyRevit 7.0+. Shift+Click: classic window (From CAD, JSON)."
description: |
  FamiGen Studio (pyRevit 7.0+): describe a family or attach a photo / PDF cut sheet, Claude builds it, review it in 3D (detail levels, visual styles, types, reference planes) and create the .rfa
  From CAD: scan imported DWG blocks and export each unique block as an .rfa family
  From JSON: generate fully parametric families from a structured JSON schema definition
  Batch: create standard families from built-in presets without any source file
author: "Tran Tien Thanh"
version: "1.0.0"
