/* ── Liquid glass: one full-window canvas, every panel a pane floating over it ── */
:root {
  --bg: radial-gradient(55% 50% at 12% 8%, #FFD3B5 0, transparent 62%), radial-gradient(50% 50% at 92% 12%, #C9DCFF 0, transparent 62%),

  --sunken: rgba(24,24,27,.055); --border: rgba(24,24,27,.11); --border-strong: rgba(24,24,27,.32);
  --grid-major: rgba(24,24,27,.13); --blur: blur(22px) saturate(1.7);
  --lift: 0 1px 2px rgba(24,24,27,.06), 0 10px 24px -10px rgba(24,24,27,.28);
  --float: 0 2px 6px rgba(24,24,27,.06), 0 24px 48px -18px rgba(24,24,27,.35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: radial-gradient(55% 50% at 12% 8%, #5A2A10 0, transparent 62%), radial-gradient(50% 50% at 92% 12%, #142B58 0, transparent 62%),
          radial-gradient(60% 60% at 68% 104%, #2E1D55 0, transparent 62%), #0C0C10;
    --glass: rgba(34,34,40,.5); --glass-strong: rgba(40,40,46,.68); --field: rgba(255,255,255,.07);
    --edge: rgba(255,255,255,.14); --shine: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(255,255,255,.04);
    --sunken: rgba(255,255,255,.07); --border: rgba(255,255,255,.12); --border-strong: rgba(255,255,255,.34);
    --grid-major: rgba(255,255,255,.12);
    --lift: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -10px rgba(0,0,0,.7);
    --float: 0 2px 6px rgba(0,0,0,.4), 0 24px 48px -18px rgba(0,0,0,.8);
  }
}
body { display: block; background: var(--bg); background-attachment: fixed; }
header, aside, .zoom, .node, dialog { background: var(--glass); border: 1px solid var(--edge);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shine), var(--float); }
#viewport { position: fixed; inset: 0; z-index: 0; }
header { position: fixed; z-index: 2; top: 12px; left: 12px; right: 12px; height: 52px; padding: 0 10px 0 18px; border-radius: 26px; }
main { display: block; }
aside { position: fixed; z-index: 2; top: 76px; bottom: 12px; width: 248px; border-radius: 24px; }

.node { background: var(--glass-strong); border-radius: 18px; box-shadow: var(--shine), var(--lift);
  -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6); }
.node:hover { border-color: var(--edge); box-shadow: var(--shine), var(--float); }

.node::before { left: 7px; top: 14px; bottom: 14px; }

button.ghost, .zoom button { background: transparent; box-shadow: none; }

button.primary:hover:not(:disabled) { background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), var(--accent); }
input, select, textarea { background: var(--field); border-radius: 12px; }

/* ── Flow: Start → Steps (or Map) → Needs you ── */
.seg { display: inline-flex; padding: 3px; border-radius: 18px; background: var(--sunken); border: 1px solid var(--border); }
.seg button { height: 28px; border: 0; background: transparent; box-shadow: none; border-radius: 14px; padding: 0 14px; color: var(--text2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--lift); }
.ready { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); white-space: nowrap; }

.ready.ok i { background: var(--ok); } .ready.off { color: var(--muted); }
body.mode-steps #world, body.mode-steps .zoom, body.mode-steps #empty { display: none; }

<script>
'use strict';
const NODE_W = 248, NODE_H = 108, COL = 320, ROW = 140;
// Plain words: a job (session) is a list of steps (tasks) that agents take.
const STATUS = {todo: 'Waiting', claimed: 'Working', review: 'Needs your review', done: 'Done', failed: 'Failed'};
const SVG = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

// The token arrives once in the link the terminal printed; keep it out of the address bar.
const TOKEN = (() => {
  const k = new URLSearchParams(location.search).get('k');
  if (k) { try { sessionStorage.setItem('t3studio.k', k); } catch (e) {} history.replaceState(null, '', '/'); return k; }
  try { return sessionStorage.getItem('t3studio.k') || ''; } catch (e) { return ''; }
})();

let S = null, want = null;                           // state, job asked for
const drawn = {};                                    // what each region last showed
let sel = null, selEdge = null, dirty = false;       // selected step key / edge / unsaved form
let view = {x: 40, y: 40, z: 1}, pos = {}, posFor = null;
let mode = 'steps', starting = false, fitted = false; // steps | map; the Start screen is open
try { mode = localStorage.getItem('t3studio.mode') === 'map' ? 'map' : 'steps'; } catch (e) {}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false)
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function toast(text, bad) {
  const t = $('toast'); t.textContent = text; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.style.display = 'none'; }, bad ? 7000 : 2600);
}
const HUES = ['#2563EB', '#7C3AED', '#C026D3', '#0D9488', '#B45309', '#4D7C0F', '#0369A1', '#BE123C'];
const GLYPH = {
  chat:     ['M5 5.5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-6.5L8 20v-3.5H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z'],
  terminal: ['M4 5h16a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 4 5z', 'M7 10l3 2.5L7 15', 'M12.5 15H17'],
  code:     ['M9 7l-5 5 5 5', 'M15 7l5 5-5 5'],
  lift:     ['M4 19c4.5-2.6 11.5-2.6 16 0', 'M12 15.5v-2', 'M7.5 14l-1-1.6', 'M16.5 14l1-1.6', [12, 7.5, 3.2]],
  pointer:  ['M6 4l12.5 7-5.6 1.3L10.6 18z'],
  graph:    ['M8.5 8H11a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h.5', [6.5, 8, 2.1], [17.5, 16, 2.1]],
  person:   ['M5 20c.9-3.9 3.6-6 7-6s6.1 2.1 7 6', [12, 8, 3.6, 'line']],
  claw:     ['M7 4.5c-2.2 5-1.4 10.4 2.8 15', 'M12 3.5c-1.3 5.8-.4 11.4 2.2 16', 'M17 4.5c1.3 5 .4 9.8-2 13.5'],
  cloud:    ['M7.5 18.5a4.2 4.2 0 0 1-.4-8.4 5.2 5.2 0 0 1 10-1.3 4.6 4.6 0 0 1-.1 9.7z'],
  hook:     ['M10 14.2a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2', 'M14 9.8a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2'],
  plug:     ['M9 3.5V8', 'M15 3.5V8', 'M6 8h12v2.5a6 6 0 0 1-12 0z', 'M12 16.5V21'],
  robot:    ['M7.5 8.5h9a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z', 'M12 4.5v4', [12, 4, 1.1], [9.3, 13.5, 1.2], [14.7, 13.5, 1.2]],
};
const KNOWN = {                                       // agent id -> [glyph, colour]
  'claude-desktop': ['chat', '#C2410C'], 'claude-code': ['terminal', '#9A3412'], 'codex': ['code', '#0F766E'],
  'antigravity': ['lift', '#2563EB'], 'cursor': ['pointer', '#52525B'], 't3lab-assistant': ['graph', '#EA680C'],
  'cli': ['terminal', '#4D7C0F'], 'owner': ['person', '#3F3F46'], 'openclaw': ['claw', '#BE123C'],
};
const BY_PLATFORM = {anthropic: 'cloud', command: 'terminal', http: 'hook', mcp: 'plug'};
function avatar(name, small, platform) {              // same agent, same icon and colour, everywhere
  const id = String(name).split('/')[0];              // claude-desktop/arch is still Claude Desktop
  let n = 0; for (const c of id) n = (n * 31 + c.charCodeAt(0)) >>> 0;
  const [glyph, hue] = KNOWN[id] || KNOWN[platform] || [BY_PLATFORM[platform] || BY_PLATFORM[(S.agents[id] || {}).platform] || 'robot', HUES[n % HUES.length]];
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  for (const part of GLYPH[glyph]) {
    const el = document.createElementNS(SVG, typeof part === 'string' ? 'path' : 'circle');
    if (typeof part === 'string') el.setAttribute('d', part);
    else { el.setAttribute('cx', part[0]); el.setAttribute('cy', part[1]); el.setAttribute('r', part[2]); if (part[3] !== 'line') el.setAttribute('class', 'dot'); }
    svg.append(el);

}
function ago(s) { return s < 90 ? Math.round(s) + ' s' : s < 5400 ? Math.round(s / 60) + ' min' : Math.round(s / 3600) + ' h'; }
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

async function api(path, body) {
  const res = await fetch(path, body === undefined
    ? {headers: {'X-T3Lab-Studio': TOKEN}}
    : {method: 'POST', headers: {'X-T3Lab-Studio': TOKEN, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return res.json();
}
// One change: post it, say what failed and what to do next, then read the board again.
async function post(path, action, args, okText) {
  let out;
  try { out = await api(path, {action, args}); }
  catch (e) { toast('Harness is not answering. Click Harness on the Revit ribbon again.', true); return null; }
  if (out && out.error) { toast(out.error + (out.hint ? ' ' + out.hint : ''), true); await refresh(); return null; }
  if (okText) toast(okText);
  await refresh();
  return out || {};
}
const act = (action, args, ok) => post('/api/act', action, Object.assign({session: S && S.session}, args), ok);

async function refresh() {
  let next;
  try { next = await api('/api/state' + (want ? '?session=' + encodeURIComponent(want) : '')); }
  catch (e) { $('counts').replaceChildren(h('span', {class: 'chip failed'}, 'Disconnected')); return; }
  if (next.error) { $('counts').replaceChildren(h('span', {class: 'chip failed'}, next.error)); return; }
  S = next;
  if (!S.board) starting = true;                     // nothing to show: ask what to do
  render();
}

// ── Model helpers ───────────────────────────────────────────────────────────
const tasks = () => (S && S.board && S.board.tasks) || [];
const taskOf = key => tasks().find(t => t.task === key);
const isOpen = () => !!(S && S.board && S.board.status === 'open');
function planFields(t) {
  return {key: t.task, title: t.title, detail: t.detail || '', depends_on: t.depends_on || [],
          assignee: t.assignee || '', done_when: t.done_when || '', scope: t.scope || {}};
}
function waitsFor(t) {
  return (t.depends_on || []).filter(d => { const o = taskOf(d); return !o || o.status !== 'done'; });
}
function agentNames() {
  const names = new Set();
  for (const m of (S.board && S.board.members) || []) if (m.role !== 'lead') names.add(m.member);
  for (const n of Object.keys(S.agents || {})) names.add(n);
  for (const t of tasks()) { if (t.assignee) names.add(t.assignee); }
  return [...names].sort();
}
function ordered() {                                  // by dependency depth, then plan order
  const depth = {}, seen = {};
  const d = key => {
    if (key in depth) return depth[key];
    if (seen[key]) return 0;
    seen[key] = 1;
    const t = taskOf(key);
    depth[key] = t ? Math.max(-1, ...(t.depends_on || []).map(d)) + 1 : 0;
    return depth[key];
  };
  return tasks().map((t, i) => [d(t.task), i, t]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
}
function numbers() { const n = {}; ordered().forEach((t, i) => { n[t.task] = i + 1; }); return n; }
function needsYou() {
  const out = [];
  for (const a of S.approvals || []) {
    const key = (a.task || '').split('/')[1];
    if ((a.task || '').split('/')[0] === S.session || !a.task) out.push({kind: 'approval', a, t: key && taskOf(key)});
  }
  if (isOpen()) for (const t of tasks()) if (t.status === 'review' || t.status === 'failed') out.push({kind: t.status, t});
  return out;
}
function launched() { return Object.values(S.agents || {}).filter(c => c.platform !== 'mcp').length; }
function loadPos() {
  if (posFor === S.session) return;
  posFor = S.session; pos = {};
  try { pos = JSON.parse(localStorage.getItem('t3studio.pos.' + posFor) || '{}'); } catch (e) {}
}
function savePos() { try { localStorage.setItem('t3studio.pos.' + posFor, JSON.stringify(pos)); } catch (e) {} }
function autoLayout(all) {                            // columns by longest dependency chain
  const depth = {}, seen = {};
  const d = key => {
    if (key in depth) return depth[key];
    if (seen[key]) return 0;
    seen[key] = 1;
    const t = taskOf(key);
    depth[key] = t ? Math.max(-1, ...(t.depends_on || []).map(d)) + 1 : 0;
    return depth[key];
  };
  const rows = {};
  for (const t of tasks()) {
    const c = d(t.task);
    if (!all && pos[t.task]) continue;
    rows[c] = rows[c] || 0;
    let y = 40 + rows[c] * ROW;
    if (!all) while (tasks().some(o => pos[o.task] && Math.abs(pos[o.task][0] - (40 + c * COL)) < NODE_W && Math.abs(pos[o.task][1] - y) < NODE_H)) y += ROW;
    pos[t.task] = [40 + c * COL, y];

function applyView() {                               // the grid pans and zooms with the tasks
  $('world').style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.z + ')';
  const step = 24 * view.z + 'px', vp = $('viewport').style;
  vp.backgroundSize = step + ' ' + step;
  vp.backgroundPosition = view.x + 'px ' + view.y + 'px';
  $('zoomPct').textContent = Math.round(view.z * 100) + '%';
}
function fit() {                                      // centre in the area the panes leave free
  const ts = tasks(); if (!ts.length) { view = {x: 300, y: 120, z: 1}; return applyView(); }
  const xs = ts.map(t => pos[t.task][0]), ys = ts.map(t => pos[t.task][1]);
  const w = Math.max(...xs) + NODE_W - Math.min(...xs), hgt = Math.max(...ys) + NODE_H - Math.min(...ys);
  const vp = $('viewport').getBoundingClientRect();
  const l = $('left').getBoundingClientRect().right, r = $('right').getBoundingClientRect().left;
  const top = document.querySelector('header').getBoundingClientRect().bottom, bottom = vp.height - 64;
  const z = Math.max(.4, Math.min(1, (r - l - 72) / w, (bottom - top - 48) / hgt));
  view = {z, x: (l + r - w * z) / 2 - Math.min(...xs) * z, y: (top + bottom - hgt * z) / 2 - Math.min(...ys) * z};
  applyView();
}
function toWorld(ev) {
  const r = $('viewport').getBoundingClientRect();
  return [(ev.clientX - r.left - view.x) / view.z, (ev.clientY - r.top - view.y) / view.z];
}
function curve(x1, y1, x2, y2) {
  const k = Math.max(40, Math.abs(x2 - x1) / 2);
  return 'M' + x1 + ' ' + y1 + ' C' + (x1 + k) + ' ' + y1 + ' ' + (x2 - k) + ' ' + y2 + ' ' + x2 + ' ' + y2;
}


// ── Render ──────────────────────────────────────────────────────────────────
// A region is rebuilt only when what it shows changed: the 1.5 s poll must not
// take the focus out of a field or drop a drag in progress.
function region(name, shows, draw, force) {
  const sig = JSON.stringify(shows);
  if (!force && drawn[name] === sig) return;
  drawn[name] = sig; draw();
}
const lastSeen = s => s < 60 ? 'active now' : 'seen ' + ago(s) + ' ago';
function render(force) {
  document.body.className = starting ? 'mode-start' : 'mode-' + mode;
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', String(b.dataset.v === mode));
  loadPos();
  if (sel && !taskOf(sel)) { sel = null; dirty = false; }
  if (selEdge && !(taskOf(selEdge[1]) && (taskOf(selEdge[1]).depends_on || []).includes(selEdge[0]))) selEdge = null;
  const b = S.board || {}, open = isOpen(), run = S.run || {};
  region('header', [S.sessions, S.session, b.counts, tasks().length, S.revit, S.revit_queue, open, run.running, run.stopping,

  if (starting) { region('start', [S.flows, S.revit && S.revit.documents, S.sessions.length, starting], renderStart, force); return; }
  drawn.start = null;
  region('left', [(b.members || []).map(m => [m.member, m.role, lastSeen(m.idle_s)]), S.agents, S.setup, run, open,
                  tasks().map(t => [t.status, t.owner])], renderLeft, force);
  if (mode === 'map') region('canvas', [S.session, tasks(), sel, selEdge, open], renderCanvas, force);
  else region('steps', [S.session, b.goal, b.document, tasks(), sel, open, agentNames()], renderSteps, force);
  if (!dirty) region('right', [S.session, sel, selEdge, sel ? taskOf(sel) : [b, S.stats && Math.round(S.stats.wall_s / 60)],
                               S.approvals, open, agentNames(), tasks().map(t => [t.task, t.status, t.title])], renderRight, force);
  if (mode === 'map' && !fitted && tasks().length) { fitted = true; fit(); }
}
function renderHeader() {
  const s = $('jobSel');
  s.replaceChildren(...(S.sessions.length ? S.sessions : [{session: '', goal: 'No job yet', status: ''}]).map(x =>
    h('option', {value: x.session}, (x.status === 'closed' ? 'Finished: ' : '') + x.goal)));
  s.value = S.session || '';
  s.disabled = !S.sessions.length;
  // Ready check: what the job needs before agents can do anything in Revit.
  const r = S.revit, active = ((S.board && S.board.members) || []).filter(m => m.role !== 'lead' && m.idle_s < 300).length;
  const team = active + launched();
  const ready = $('ready');
  ready.className = 'ready' + (r && r.ok ? ' ok' : ' off');
  ready.title = r && r.ok ? 'Open: ' + (r.documents || []).join(', ') : 'Open Revit and start the server in MCP Control, then agents can work.';
  ready.replaceChildren(h('i'), r == null ? 'Checking Revit…' : r.ok ? 'Revit connected' : 'Revit not found',
    '  ·  ', team ? plural(team, 'agent') + ' ready' : 'No agent yet');
  const c = (S.board && S.board.counts) || {}, total = tasks().length, kids = [];
  if (S.board && !isOpen()) kids.push(h('span', {class: 'chip'}, 'Finished, read only'));
  const need = needsYou().length;

  const num = numbers(), others = ordered().filter(o => o.task !== t.task);
  const after = others.map(o => h('label', {class: 'check'},
    h('input', {type: 'checkbox', value: o.task, checked: (t.depends_on || []).includes(o.task), onchange: mark}), num[o.task] + '. ' + o.title));
  const save = () => {
    const scope = {write: f.write.checked};
    if (f.doc.value.trim()) scope.document = f.doc.value.trim();
    for (const [k, el] of [['levels', f.levels], ['categories', f.cats], ['element_ids', f.ids]]) if (list(el.value).length) scope[k] = list(el.value);
    for (const k of ['views', 'worksets']) if (sc[k]) scope[k] = sc[k];
    const deps = after.map(l => l.querySelector('input')).filter(i => i.checked).map(i => i.value);
    dirty = false;
    act('plan', {tasks: [{key: t.task, title: f.title.value, detail: f.detail.value, done_when: f.done.value,
      assignee: who.value, depends_on: deps, scope}]}, 'Saved');
  };
  const limited = sc.levels || sc.categories || sc.element_ids || sc.document;
  out.push(field('Step', f.title), field('What to do', f.detail), field('Done when', f.done), field('Who does it', who),
    h('label', {class: 'check'}, f.write, 'Changes the model'),
    h('p', {class: 'hint'}, 'Steps that change the same part of the model run one after another. Steps that only read never wait.'));
  if (others.length) out.push(h('div', {class: 'label'}, 'Starts after'), h('div', {class: 'checks'}, after));
  out.push(h('details', {open: limited ? true : null}, h('summary', null, 'Only part of the model'),
      field('Levels', f.levels), field('Categories', f.cats), field('Element IDs', f.ids), field('Revit file', f.doc)),
    h('div', {class: 'row split'},
      h('button', {class: 'danger', onclick: () => confirmBox('Delete "' + t.title + '"?', 'The step is removed from the list. Nothing changes in the model.', 'Delete',
        () => { dirty = false; sel = null; return act('remove', {task: t.task}, 'Step deleted'); })}, 'Delete'),
      h('button', {class: 'primary', onclick: save}, 'Save')));
  return out;
}
function taskRead(t, sc) {                            // a started step is read, not edited: no dead form
  const out = [h('h3', null, t.title)];
  if (isOpen() && t.status === 'review') {
    const note = h('textarea', {rows: 2, placeholder: 'Note for the agent (optional)', 'aria-label': 'Review note'});
    out.push(h('div', {class: 'card review'}, h('div', {class: 'label'}, (t.owner || 'The agent') + ' reported'),
      h('p', {class: 'body', style: 'margin-bottom:12px'}, t.summary || 'No report.'), note,
      h('div', {class: 'row end', style: 'margin-top:8px'},
        h('button', {onclick: () => act('review', {task: t.task, verdict: 'redo', note: note.value}, 'Sent back: an agent does it again')}, 'Send back'),
        h('button', {class: 'primary', onclick: () => act('review', {task: t.task, verdict: 'accept', note: note.value}, 'Accepted: ' + t.title)}, 'Accept'))));
  } else if (t.summary) out.push(h('div', {class: 'label'}, t.status === 'failed' ? 'Why it failed' : 'Report'), h('div', {class: 'box'}, t.summary));
  if (isOpen() && t.status === 'failed') out.push(h('div', {class: 'row end', style: 'margin-bottom:16px'},
    h('button', {class: 'primary', onclick: () => act('retry', {task: t.task}, 'Back in the list: an agent takes it again')}, 'Try again')));
  if (t.result) out.push(h('details', null, h('summary', null, 'Result data'), h('pre', {class: 'box'}, JSON.stringify(t.result, null, 2))));
  if (t.detail) out.push(h('div', {class: 'label'}, 'What to do'), h('p', {class: 'body'}, t.detail));
  const num = numbers();
  const rows = [['Done when', t.done_when], ['Agent', t.owner || t.assignee], ['Tries', t.attempts > 1 ? t.attempts : ''],
    ['Model', sc.write === false ? 'Reads only' : 'Changes it'], ['Levels', (sc.levels || []).join(', ')],
    ['Categories', (sc.categories || []).join(', ')], ['Element IDs', (sc.element_ids || []).join(', ')],
    ['Revit file', sc.document], ['Starts after', (t.depends_on || []).map(k => 'step ' + num[k]).join(', ')]].filter(r => r[1]);
  out.push(h('dl', {class: 'kv'}, rows.map(r => [h('dt', null, r[0]), h('dd', null, String(r[1]))])));
  if (isOpen() && t.status !== 'done') out.push(h('p', {class: 'hint'}, 'A step can be edited only before an agent starts it.'));
  return out;
}

// ── Start: one question, a plan, go ─────────────────────────────────────────
let startFlow = '';
function renderStart() {
  const docs = (S.revit && S.revit.documents) || [];
  const goal = h('textarea', {class: 'goal', placeholder: 'e.g. Check every door on levels 1 and 2 has a mark, and fix the missing ones', maxlength: 1000, 'aria-label': 'What do you want done?'});
  const doc = docs.length
    ? h('select', null, docs.map(d => h('option', {value: d}, d)), h('option', {value: ''}, 'Whichever file is active'))
    : h('input', {placeholder: 'PRJ.rvt (empty: whichever file is active in Revit)'});
  if (docs.length && S.revit.active) doc.value = S.revit.active;
  const steps = h('textarea', {rows: 4, placeholder: 'One step per line, e.g.\nList doors without a mark\nFix the marks on Level 1\nFix the marks on Level 2'});
  const inOrder = h('input', {type: 'checkbox', checked: true});
  const review = h('input', {type: 'checkbox', checked: true});
  const excl = h('input', {type: 'checkbox', checked: !!(S.setup && S.setup.exclusive)});
  const serial = h('input', {type: 'checkbox', checked: (S.setup && S.setup.write_mode) === 'serial'});
  const stepsBox = h('div', null, field('Steps (you can add them later)', steps), h('label', {class: 'check'}, inOrder, 'Do them in this order'));
  const chips = h('div', {class: 'chips'});
  const pick = name => { startFlow = name; for (const b of chips.children) b.setAttribute('aria-pressed', String(b.dataset.f === name)); stepsBox.style.display = name ? 'none' : ''; };
  chips.append(h('button', {'data-f': '', onclick: () => pick('')}, 'Blank'),
    (S.flows || []).map(f => h('button', {'data-f': f.name, title: f.goal || '', onclick: () => pick(f.name)}, f.name + ' (' + plural(f.tasks, 'step') + ')')));
  const go = async ev => {
    const lines = steps.value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!goal.value.trim() && !startFlow) { goal.focus(); return toast('Say what you want done first.', true); }
    ev.target.disabled = true;
    const args = {goal: goal.value.trim(), revit_document: doc.value.trim(), review: review.checked, exclusive: excl.checked, write_mode: serial.checked ? 'serial' : 'scoped'};
    const out = startFlow ? await post('/api/flow', 'apply', Object.assign({name: startFlow}, args)) : await post('/api/act', 'open', args);
    if (out && out.session && !startFlow && lines.length)
      await post('/api/act', 'plan', {session: out.session, tasks: lines.map((title, i) => ({key: 's' + (i + 1), title,
        depends_on: inOrder.checked && i ? ['s' + i] : []}))});
    ev.target.disabled = false;
    if (out && out.session) { want = out.session; starting = false; sel = null; fitted = false; mode = 'steps'; drawn.steps = null; await refresh(); toast('Job ready: agents can take the steps now'); }
  };
  const kids = [h('h1', null, 'What do you want done?'),
    h('p', {class: 'lead'}, 'Write the goal, list the steps if you know them, and agents take them one by one. You approve the changes.'),
    goal, h('div', {style: 'height:16px'}), field('Revit file', doc)];
  if ((S.flows || []).length) kids.push(h('div', {class: 'label'}, 'Start from'), chips);
  kids.push(stepsBox, h('label', {class: 'check'}, review, 'I review each step before it counts'),
    h('details', null, h('summary', null, 'Advanced'),
      h('label', {class: 'check'}, excl, 'Agents need a step to change this file'),
      h('label', {class: 'check'}, serial, 'Only one step changes the model at a time')),
    h('div', {class: 'actions'},
      S.sessions.length ? h('button', {onclick: () => { starting = false; render(true); }}, 'Cancel') : null,
      h('button', {class: 'primary', onclick: go}, 'Plan it')));
  $('start').replaceChildren(...kids);
  pick(startFlow && (S.flows || []).some(f => f.name === startFlow) ? startFlow : '');
  setTimeout(() => goal.focus(), 0);
}

// ── Dialogs ─────────────────────────────────────────────────────────────────
function show(...kids) { const d = $('dlg'); d.replaceChildren(...kids); if (!d.open) d.showModal(); }
const closeDlg = () => $('dlg').close();
function confirmBox(title, text, yes, run) {          // Cancel is the default answer
  show(h('h3', null, title), h('p', null, text), h('div', {class: 'row end'},
    h('button', {autofocus: true, onclick: closeDlg}, 'Cancel'),
    h('button', {class: 'danger', onclick: async () => { closeDlg(); await run(); }}, yes)));
}
function flowsDialog() {
  const name = h('input', {placeholder: 'door-audit', maxlength: 40});
  const rows = (S.flows || []).map(f => h('div', {class: 'flow'},
    h('div', {class: 'who'}, h('div', null, f.name), h('div', {class: 'hint', style: 'margin:0'}, plural(f.tasks, 'step') + (f.goal ? ': ' + f.goal : ''))),
    h('button', {disabled: !isOpen(), title: 'Add these steps to this job', onclick: async () => { closeDlg(); await post('/api/flow', 'apply', {name: f.name, session: S.session}, 'Added the steps of ' + f.name); }}, 'Add steps'),
    h('button', {class: 'danger', onclick: () => confirmBox('Delete template "' + f.name + '"?', 'Jobs already started from it keep their steps.', 'Delete', () => post('/api/flow', 'delete', {name: f.name}, 'Template deleted'))}, 'Delete')));
  show(h('h3', null, 'Templates'), h('p', {class: 'hint'}, 'A template is a list of steps saved for the next job: what to do, who does it and in which order.'),
    rows.length ? rows : h('p', {class: 'hint'}, 'No template yet.'),
    h('div', {class: 'label', style: 'margin-top:16px'}, 'Save this job\'s steps as a template'),
    h('div', {class: 'row'}, h('div', {style: 'flex:1'}, name),
      h('button', {disabled: !tasks().length, onclick: async () => { const n = name.value.trim().toLowerCase(); closeDlg(); await post('/api/flow', 'save', {name: n, session: S.session}, 'Saved ' + plural(tasks().length, 'step') + ' as ' + n); }}, 'Save')),
    h('div', {class: 'row end', style: 'margin-top:16px'}, h('button', {onclick: closeDlg}, 'Done')));
}
function agentDialog() {
  const KINDS = [['command', 'A command on this computer', '{"command": ["claude", "-p", "{prompt}"]}'],
                 ['anthropic', 'An agent in the Anthropic Console', '{"agent_id": "agent_...", "environment_id": "env_...", "max_usd": 2}'],
                 ['http', 'A webhook (n8n, Dify, your service)', '{"url": "https://example.com/hook", "token_env": "MY_TOKEN"}'],
                 ['mcp', 'An AI app that connects by itself', '{}']].filter(k => (S.platforms || []).includes(k[0]));
  const name = h('input', {placeholder: 'console-qa', maxlength: 40, autofocus: true});
  const platform = h('select', null, KINDS.map(k => h('option', {value: k[0]}, k[1])));
  const role = h('select', null, h('option', {value: 'worker'}, 'Does steps'), h('option', {value: 'reviewer'}, 'Reviews steps'));
  const cfg = h('textarea', {class: 'mono', rows: 4}, KINDS.length ? KINDS[0][2] : '{}');
  platform.onchange = () => { cfg.value = (KINDS.find(k => k[0] === platform.value) || [, , '{}'])[2]; };
  const go = async () => {
    let extra; try { extra = JSON.parse(cfg.value || '{}'); } catch (e) { return toast('Settings is not valid JSON.', true); }
    closeDlg();
    await post('/api/act', 'agent_add', {name: name.value.trim().toLowerCase(), config: Object.assign({platform: platform.value, role: role.value}, extra)}, 'Added ' + name.value.trim());
  };
  show(h('h3', null, 'Add agent'), field('Name', name), field('Kind', platform), field('Role', role),
    h('details', null, h('summary', null, 'Settings (no key or token here)'), cfg),
    h('p', {class: 'hint'}, 'Agents you add read the model and need your approval to change it. Step text and results are sent to where the agent runs.'),
    h('div', {class: 'row end'}, h('button', {onclick: closeDlg}, 'Cancel'), h('button', {class: 'primary', onclick: go}, 'Add agent')));
}

// ── Wiring ──────────────────────────────────────────────────────────────────
$('jobSel').onchange = ev => { want = ev.target.value; sel = null; selEdge = null; dirty = false; fitted = false; starting = false; refresh(); };
$('btnNew').onclick = () => { starting = true; drawn.start = null; render(); };
for (const b of document.querySelectorAll('.seg button')) b.onclick = () => {
  mode = b.dataset.v; try { localStorage.setItem('t3studio.mode', mode); } catch (e) {}
  drawn.canvas = drawn.steps = null; fitted = false; render(); };
$('btnAdd').onclick = () => addTask(null);
$('btnTidy').onclick = () => { pos = {}; autoLayout(true); render(true); fit(); };
$('btnRun').onclick = () => post('/api/run', S.run && S.run.running ? 'stop' : 'start', {session: S.session});
refresh();
setInterval(() => { if (!starting || !S || S.board) refresh(); }, 1500);
</script>
</body>
</html>
